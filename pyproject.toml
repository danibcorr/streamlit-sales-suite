[project]
name = "streamlit-sales-suite"
version = "0.1.9"
description = "Streamlit Sales Suite"
authors = [
    {name = "Daniel Bazo Correa", email = "none@none.com"},
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Topic :: Software Development",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "openpyxl==3.1.5",
    "pandas==3.0.3",
    "plotly==6.7.0",
    "streamlit==1.57.0",
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true } }]

[dependency-groups]
pipeline = [
    "bandit==1.9.4",
    "complexipy==5.5.0",
    "mypy==1.20.2",
    "pytest==9.0.3",
    "ruff==0.15.15",
    "pre-commit==4.6.0",
]

[tool.ruff]
line-length = 88
indent-width = 4
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E203"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["src"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
combine-as-imports = true
split-on-trailing-comma = true

[tool.ruff.lint.isort.import-heading]
standard-library = "Standard libraries"
third-party = "3pps"
first-party = "Own modules"
local-folder = "Own modules"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "^(build|dist|venv)",
    ".venv/"
]
cache_dir = "/dev/null"
